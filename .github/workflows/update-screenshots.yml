name: Update screenshots

# Makes the screenshot baselines for web/e2e/visual.spec.ts on the SAME runner
# image the Verify workflow compares on. Baselines made on a Mac or in a dev
# container differ in fonts and antialiasing, so they would fail here for
# reasons that are not changes (web/playwright.config.ts).
#
# Manual only: Actions → Update screenshots → Run workflow, on the branch whose
# look is the new truth. It COMMITS the PNGs to that branch (7 Oct 2026; it
# used to only upload an artifact, and nothing could download it from the
# cloud sessions this repo is built in, so the baselines were never made).
# A new baseline is still a reviewed diff: it lands on a feature branch and
# reaches main only through a pull request. It refuses to run on main.
#
# A push made with GITHUB_TOKEN does not start Verify. The next push to the
# branch does, and compares against these.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screenshots:
    name: Make screenshot baselines
    runs-on: ubuntu-latest
    if: ${{ github.ref != 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install web dependencies
        run: |
          npm install --no-audit --no-fund --prefix web \
            || (sleep 25 && npm install --no-audit --no-fund --prefix web)

      - name: Build web
        run: npm run build --prefix web

      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Make the baselines
        working-directory: web
        run: npx playwright test visual --update-snapshots

      - name: Keep them
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: web/e2e/__screenshots__
          retention-days: 14

      - name: Commit them to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo 'Baselines unchanged.'
            exit 0
          fi
          git commit -m 'Screenshot baselines from the Update screenshots workflow'
          git push origin HEAD:${{ github.ref_name }}
