name: Deploy worker

# Deploys the pipeline worker (worker/) to Fly app app1-mmbfma: the `worker`
# and `pdf` process groups. Manual only — Actions → Deploy worker → Run
# workflow. Never on push: a deploy is a production change (CLAUDE.md §11).
#
# WHY IT RUNS HERE
#
# The Windows machine cannot install anything (CLAUDE.md §2), so flyctl
# cannot run there. The build happens on Fly's remote builder; this job only
# drives it.
#
# THE ONE FLAG THAT MUST NOT GO
#
# `--process-groups worker,pdf`. The same app runs the OSRM router as a third
# machine (process group `osrm`, docs/OSRM.md), which is not in
# worker/fly.toml. A deploy without the flag replaces machines that are not
# in [processes] — it would delete the router, and every walking time would
# silently fall back to the interim one.
#
# Needs one repository secret, FLY_API_TOKEN: a deploy token for app1-mmbfma
# (Fly dashboard → app1-mmbfma → Tokens). The app's own secrets
# (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, PAGE_BASE_URL) live on Fly, never
# here; the first step only checks that their NAMES exist.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy worker and pdf to Fly
    runs-on: ubuntu-latest
    # Only what is merged. A branch deploy would put unreviewed code on the
    # machines that hold the service-role key.
    if: github.ref == 'refs/heads/main'

    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: app1-mmbfma

    steps:
      - uses: actions/checkout@v5

      # Fly's own installer, rather than a third-party action.
      - name: Install flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Check the token is set
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not set. GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Fail before building rather than boot a worker that exits on start.
      # `secrets list` prints names and digests, never values.
      - name: Check the app's secrets exist
        run: |
          names="$(flyctl secrets list --app "$FLY_APP" --json | jq -r '.[] | (.Name // .name)')"
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY PAGE_BASE_URL; do
            if ! grep -qx "$name" <<< "$names"; then
              echo "::error::Fly secret $name is missing on $FLY_APP (Fly dashboard → $FLY_APP → Secrets)."
              missing=1
            fi
          done
          exit $missing

      # From the repo root: the Dockerfile copies worker/ and the root
      # .dockerignore keeps the rest of the checkout out of the context.
      # --ha=false: one machine per group; a second would be a standby with
      # no HTTP traffic to fail over.
      - name: Deploy
        run: |
          flyctl deploy \
            --app "$FLY_APP" \
            --config worker/fly.toml \
            --dockerfile worker/Dockerfile \
            --process-groups worker,pdf \
            --ha=false \
            --remote-only

      - name: Machines after deploy
        if: always()
        run: flyctl status --app "$FLY_APP"
