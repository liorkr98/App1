name: Verify

# The verification gate: typecheck, lint and test before anything is done
# (CLAUDE.md §10.4).
#
# WHY THIS EXISTS ALONGSIDE .eas/workflows/verify.yml
#
# This project is developed from two machines, and npm is blocked by corporate
# endpoint protection on the Windows one — nothing there can be installed,
# typechecked, linted or tested. EAS Workflows was the only place it could run
# — and on 9 September 2026 the account hit the free plan's 60 minute CI/CD
# cap, which does not reset until 1 October. That left no way to verify a
# single line.
#
# npm DOES work on the macOS machine (CLAUDE.md §2), so the same steps can be
# run locally there before pushing. That makes local verification evidence,
# not a substitute: this workflow is still the gate, because it is the
# environment the deploy builds from and the only one both machines share.
#
# GitHub Actions costs nothing here and has no such cap. This is now the
# primary gate. The EAS workflow stays: it is the one that can build and submit
# a native app, should that ever return, and it costs nothing to keep.
#
# Every step below mirrors the EAS one deliberately. If they drift, the green
# tick on one of them stops meaning what it appears to mean.

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch: {}

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches worker/package.json engines, and the version whose test
          # runner behaviour the worker's npm script depends on.
          node-version: '22'

      # --- Shared domain ----------------------------------------------------
      # src/types and src/features only. The React Native app that used to live
      # here is at the react-native-v1 tag (RESEARCH.md v2: web only).
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The shared domain had no test runner between the React Native app's
      # removal and this. Photo ordering is the first thing that needed one.
      - name: Test
        run: npm run test

      # --- Web workspace ----------------------------------------------------
      # Its own package.json, deliberately not an npm workspace: making the
      # root a workspace root would rewrite web's and worker's dependency
      # trees.
      - name: Install web dependencies
        run: npm install --no-audit --no-fund --prefix web

      - name: Web typecheck
        run: npm run typecheck --prefix web

      - name: Verify no physical left/right in web
        run: node scripts/verify-web-logical-props.mjs

      # Plants a violation and asserts the rule catches it. A rule that
      # silently stops matching is worse than no rule.
      - name: Verify the web logical-property rule actually fires
        run: bash scripts/verify-web-lint-fires.sh

      - name: Build web
        run: npm run build --prefix web

      - name: Verify exactly four template divergences
        run: node scripts/verify-template-divergences.mjs

      # CLAUDE.md §4.2. A missing <bdi> is invisible in review AND usually on
      # the page: a bare number reads correctly until the words around it
      # change, then silently reorders. Runs on built HTML so it sees what is
      # actually served.
      - name: Verify every number is inside <bdi>
        run: node scripts/verify-bdi.mjs

      # §4.1 — a rule that stops firing is worse than no rule, so the rule is
      # proved against a planted violation on every run.
      - name: Verify the <bdi> rule actually fires
        run: bash scripts/verify-bdi-fires.sh

      # Stage B2. The scroll-driven motion is wrapped in both @supports and
      # the reduced-motion query, and both failures are silent: a reveal that
      # escapes @supports hides content permanently in Firefox, and an
      # animation-timeline that escapes the media query moves the page for
      # someone who switched movement off.
      - name: Verify the motion degrades correctly
        run: node scripts/verify-motion-fallbacks.mjs

      - name: Report built page weight
        run: node scripts/report-page-weight.mjs

      # --- Worker -----------------------------------------------------------
      # Typecheck and unit tests only. What CI does NOT prove is the pipeline
      # itself: sharp and Puppeteer both need real media, a real Supabase
      # project and a browser, none of which exist on a runner.
      # docs/PIPELINE.md says so in as many words rather than letting a green
      # tick imply otherwise.
      - name: Install worker dependencies
        env:
          # Nothing here launches a browser, and the download is ~150MB.
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install --no-audit --no-fund --prefix worker

      - name: Worker typecheck
        run: npm run typecheck --prefix worker

      # The test command passes an explicit GLOB over compiled output, and both
      # halves matter. Handed a directory, Node's runner treats every file
      # under it as a test — it ran the worker's own index.js, started the
      # queue loop and hung the job. Handed nothing, it falls back to default
      # discovery, which on Node 22.23 includes .ts files: it then ran the
      # SOURCES, whose './x.js' specifiers only resolve after compilation.
      - name: Worker tests
        run: npm run test --prefix worker

      # --- Ingestion --------------------------------------------------------
      # Typecheck only. Running a sync needs a live Supabase project, an OSRM
      # instance and the OSM extract; none exist on a runner, and none of this
      # code has ever executed. docs/DATA-SOURCES.md says which parts were
      # verified against the live APIs and which were written blind.
      - name: Install ingest dependencies
        run: npm install --no-audit --no-fund --prefix ingest

      - name: Ingest typecheck
        run: npm run typecheck --prefix ingest

      - name: Ingest tests
        run: npm run test --prefix ingest
