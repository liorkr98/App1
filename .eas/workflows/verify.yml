name: Verify

# Stage verification runs in Expo's cloud because registry.npmjs.org is
# blocked on the primary dev machine. This is the CLAUDE.md §9 step 4 gate:
# typecheck and lint must pass before a stage is considered done.

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch: {}

jobs:
  verify:
    name: Typecheck, lint and test
    steps:
      - name: Checkout
        uses: eas/checkout

      # --- Mobile app -----------------------------------------------------
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Verify the RTL lint rules actually fire
        run: bash scripts/verify-rtl-lint.sh

      # --- Web workspace --------------------------------------------------
      # Its own package.json, deliberately not an npm workspace: making the
      # root a workspace root would rewrite the React Native dependency tree.
      - name: Install web dependencies
        run: npm install --no-audit --no-fund --prefix web
      - name: Web typecheck
        run: npm run typecheck --prefix web
      - name: Verify no physical left/right in web
        run: node scripts/verify-web-logical-props.mjs
      - name: Verify the web logical-property rule actually fires
        run: bash scripts/verify-web-lint-fires.sh
      - name: Build web
        run: npm run build --prefix web
      - name: Verify exactly four template divergences
        run: node scripts/verify-template-divergences.mjs
      - name: Report built page weight
        run: node scripts/report-page-weight.mjs

      # --- Worker ---------------------------------------------------------
      # Typecheck plus the unit tests over the pure maths. What CI does NOT
      # prove is the pipeline itself: stitching, ffmpeg and Puppeteer all need
      # real media, a real Supabase project and a browser, none of which exist
      # on this runner. docs/PIPELINE.md says so in as many words rather than
      # letting a green tick imply otherwise.
      #
      # PUPPETEER_SKIP_DOWNLOAD: nothing here launches a browser, and the
      # download is ~150MB on every single run.
      - name: Install worker dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=true npm install --no-audit --no-fund --prefix worker
      - name: Worker typecheck
        run: npm run typecheck --prefix worker
      - name: Worker tests
        run: npm run test --prefix worker
      - name: Verify the sprite layout matches the viewer
        run: node scripts/verify-sprite-layout.mjs
