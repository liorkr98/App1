name: Verify

# Stage verification runs in Expo's cloud because registry.npmjs.org is
# blocked on the primary dev machine. This is the CLAUDE.md §10 step 4 gate:
# typecheck and lint must pass before a stage is considered done.
#
# EAS runs this even though the product is no longer a React Native app: the
# `expo` root dependency and app.config.ts exist to anchor this project, and
# without them there is nowhere to verify anything at all.

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch: {}

jobs:
  verify:
    name: Typecheck, lint and test
    steps:
      - name: Checkout
        uses: eas/checkout

      # --- Shared domain --------------------------------------------------
      # src/types and src/features only. The React Native app that used to
      # live here is at the react-native-v1 tag (RESEARCH.md v2: web only).
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

      # --- Web workspace --------------------------------------------------
      # Its own package.json, deliberately not an npm workspace: making the
      # root a workspace root would rewrite web's and worker's dependency
      # trees.
      - name: Install web dependencies
        run: npm install --no-audit --no-fund --prefix web
      - name: Web typecheck
        run: npm run typecheck --prefix web
      - name: Verify no physical left/right in web
        run: node scripts/verify-web-logical-props.mjs
      - name: Verify the web logical-property rule actually fires
        run: bash scripts/verify-web-lint-fires.sh
      - name: Build web
        run: npm run build --prefix web
      - name: Verify exactly four template divergences
        run: node scripts/verify-template-divergences.mjs
      - name: Report built page weight
        run: node scripts/report-page-weight.mjs

      # --- Worker ---------------------------------------------------------
      # Typecheck plus the unit tests over the pure maths. What CI does NOT
      # prove is the pipeline itself: sharp and Puppeteer both need real
      # media, a real Supabase project and a browser, none of which exist on
      # this runner. docs/PIPELINE.md says so in as many words rather than
      # letting a green tick imply otherwise.
      #
      # PUPPETEER_SKIP_DOWNLOAD: nothing here launches a browser, and the
      # download is ~150MB on every single run.
      - name: Install worker dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=true npm install --no-audit --no-fund --prefix worker
      - name: Worker typecheck
        run: npm run typecheck --prefix worker
      # The test command passes an explicit GLOB over the compiled output, and
      # both halves of that matter. Handed a directory, Node's runner treats
      # every file under it as a test — it ran the worker's own index.js,
      # started the queue loop and hung this job until it was cancelled by
      # hand. Handed nothing, it falls back to default discovery, which on
      # Node 22.23 includes .ts files: it then ran the SOURCES, which import
      # './x.js' specifiers that only exist after compilation.
      - name: Worker tests
        run: npm run test --prefix worker

      # --- Ingestion ------------------------------------------------------
      # Typecheck only; see the GitHub workflow for why.
      - name: Install ingest dependencies
        run: npm install --no-audit --no-fund --prefix ingest
      - name: Ingest typecheck
        run: npm run typecheck --prefix ingest

      - name: Ingest tests
        run: npm run test --prefix ingest
