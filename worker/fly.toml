# Fly configuration for the pipeline worker (ADR 0001).
#
# Deploy from the REPO ROOT so the Dockerfile can see worker/:
#   fly deploy --app app1-mmbfma --config worker/fly.toml --dockerfile worker/Dockerfile
#
# Secrets are set by hand and never live in this file or the repo:
#   fly secrets set --app app1-mmbfma SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=...
#
# The service-role key bypasses RLS entirely. It is the one credential in the
# system that must never reach a client (CLAUDE.md §8).

app = "app1-mmbfma"
primary_region = "fra"   # Frankfurt, matching the eu-central-1 Supabase project

[build]

[env]
  IDLE_POLL_MS = "5000"
  STALE_CLAIM_MS = "600000"

  # PAGE_BASE_URL — where the published listing pages live, e.g.
  # "https://listings.example.com". The pdf group drives a real browser against
  # the real page, so this has to be the deployed origin, not a placeholder.
  #
  # Left unset on purpose: a wrong value here would render 404 pages into
  # PDFs rather than failing. Set it with
  #   fly secrets set --app app1-mmbfma PAGE_BASE_URL=https://besivov.liorkr98.workers.dev
  # Switch to https://hasivuv.com once that origin resolves. Only pdf reads it.

# ---------------------------------------------------------------------------
# Process groups
# ---------------------------------------------------------------------------
#
# Chrome is memory-hungry and it crashes. Sharing a process with image work
# means a Chrome OOM kills an enhancement job mid-run — a bug that presents as
# "sometimes a photo fails" and is very hard to trace back.

[processes]
  worker = "node dist/index.js"
  pdf = "node dist/index.js"

# ---------------------------------------------------------------------------
# worker — image enhancement and Open Graph
# ---------------------------------------------------------------------------

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-2x"
  memory = "2gb"

# ---------------------------------------------------------------------------
# pdf — Puppeteer only
# ---------------------------------------------------------------------------
#
# Capped memory and its own machine so a Chrome OOM restarts this group alone.

[[vm]]
  processes = ["pdf"]
  size = "shared-cpu-1x"
  memory = "1gb"

# No HTTP service. Fly Proxy therefore cannot autostop these machines; they
# stay up and poll Postgres. `--ha=false` on first deploy so each group gets
# one machine, not two standbys with nothing to fail over to.
#
# Restart always: a Chrome OOM in pdf, or a thrown boot error, must come back
# without waiting for traffic that never arrives.
[[restart]]
  policy = "always"
  processes = ["worker"]

[[restart]]
  policy = "always"
  processes = ["pdf"]

[[metrics]]
  port = 9091
  path = "/metrics"
