<!DOCTYPE html>
<html lang="he" dir="rtl" data-template="brochure">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ברושור — תבנית ייחוס</title>
<meta name="robots" content="noindex">
</head>
<body>
<a class="skip" href="#main">דילוג לתוכן</a>
<header class="agent-bar"><strong>ליאור</strong><span>היעד</span></header>
<main id="main">
  <section class="hero">
    <img class="hero-img" alt="מבט לסלון" src="/sample/frame.png" width="1200" height="1600">
    <div class="hero-veil">
      <h1 class="hero-title">דירת <bdi>4</bdi> חדרים בסוקולוב</h1>
    </div>
  </section>
  <div class="price-bar"><div class="price"><bdi>₪1,850,000</bdi></div></div>
  <div class="facts">
    <div class="fact"><div class="fact-val"><bdi>4</bdi></div><div class="fact-lbl">חדרים</div></div>
    <div class="fact"><div class="fact-val"><bdi>95</bdi></div><div class="fact-lbl">מ״ר</div></div>
    <div class="fact"><div class="fact-val"><bdi>3</bdi></div><div class="fact-lbl">קומה</div></div>
  </div>
  <section>
    <h2>על הדירה</h2>
    <p>תצלום אחד שולט במסך הראשון. הפרטים דלילים. בלי שירה על שטח ירוק.</p>
  </section>
</main>
</body>
</html>
